[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-harness"
version = "0.1.0"
description = "Verified-execution harness for an OpenCode-style coding agent: permission-checked tool calls, snapshotted mutations, independently verified results, and a single evidence-based gate decision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-generativeai>=0.7.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "httpx>=0.27",
    "tenacity>=8.3",
]

[project.optional-dependencies]
docs = ["reportlab"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.23",
]

[project.scripts]
harness-run      = "harness.entry:cli_run"
harness-verify   = "harness.entry:cli_verify"
harness-inspect  = "harness.entry:cli_inspect"
harness-evaluate = "harness.entry:cli_evaluate"
harness-bench    = "harness.entry:cli_bench"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
